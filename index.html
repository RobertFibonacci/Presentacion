    <script>
        const DB_NAME = 'ProspectaDB';
        const DB_VERSION = 2; // Actualizado a la versión 2 para crear el nuevo almacén
        let db = null;

        // 1. VARIABLE GLOBAL DE ESTADO (Reemplaza a localStorage)
        window.CRM_STATE = {};
        let activeProfileId = null;
        let saveTimeout = null;

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { db = request.result; resolve(db); };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('profiles')) {
                        database.createObjectStore('profiles', { keyPath: 'id' });
                    }
                    // Nuevo almacén para el caché temporal (sustituye localStorage)
                    if (!database.objectStoreNames.contains('config')) {
                        database.createObjectStore('config', { keyPath: 'id' });
                    }
                };
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                if (!db) { resolve(); return; }
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve) => {
                if (!db) { resolve([]); return; }
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        }

        function dbDelete(storeName, id) {
            return new Promise((resolve) => {
                if (!db) { resolve(); return; }
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        // 2. MOTOR DE AUTOGUARDADO EN MEMORIA (Evita saturar la base de datos por cada tecla)
        function saveTempStateToDB() {
            if(saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                if (db) dbPut('config', { id: 'estado_temporal', data: window.CRM_STATE });
            }, 500); 
        }

        async function loadTempStateFromDB() {
            if(!db) return;
            const tx = db.transaction('config', 'readonly');
            const store = tx.objectStore('config');
            return new Promise((resolve) => {
                const req = store.get('estado_temporal');
                req.onsuccess = () => {
                    if(req.result && req.result.data) {
                        window.CRM_STATE = req.result.data;
                    }
                    resolve();
                };
                req.onerror = () => resolve();
            });
        }

        function comprimirImagen(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const max_size = 1200; 
                    let w = img.width; 
                    let h = img.height;
                    if (w > h) { 
                        if (w > max_size) { h *= max_size / w; w = max_size; } 
                    } else { 
                        if (h > max_size) { w *= max_size / h; h = max_size; } 
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = w; 
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    callback(canvas.toDataURL('image/webp', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

            scriptFontSize += (step * 2);

        function initBackgroundStars() {
            const container = document.getElementById('stars-container');
            if(!container) return;

            for(let i=0; i<starCount; i++) {
                const star = document.createElement('div');

        let intendedFullscreen = false;
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                intendedFullscreen = true; 
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                intendedFullscreen = false; 
            }
        }

        function ajustarAlturaPortada(src) {
            if (!src) return;
            const img = new Image();
            img.onload = function() {
                const ratio = this.height / this.width;
                const cards = document.querySelectorAll('.profile-card-sync');
                const covers = document.querySelectorAll('.portada-sync');
                if (!cards.length || !covers.length) return;
                
                let cardWidth = cards[0].offsetWidth;
                if (cardWidth === 0) {
                    cardWidth = Math.min(window.innerWidth - 32, 450);
                }

                let newHeight = cardWidth * ratio;
                if (newHeight > 220) newHeight = 220; 
                if (newHeight < 100) newHeight = 100;
                
                covers.forEach(c => c.style.height = newHeight + 'px');
                cards.forEach(c => c.style.paddingTop = (newHeight - 50) + 'px');
            };
            img.src = src;
        }

        function actualizarImagen(event, targetClass, isBackground) {
            const file = event.target.files[0];
            if (!file) return;

            comprimirImagen(file, function(optimizedBase64) {
                const targets = document.querySelectorAll('.' + targetClass);
                
                targets.forEach(target => {
                    if (isBackground) {
                        target.style.backgroundImage = `linear-gradient(to bottom, rgba(62,62,97,0.5), transparent), url('${optimizedBase64}')`;
                    } else {
                        target.src = optimizedBase64;
                    }
                });

                // Reemplazo localStorage
                if (isBackground) {
                    ajustarAlturaPortada(optimizedBase64); 
                    window.CRM_STATE['prospecta_portada'] = optimizedBase64;
                } else {
                    window.CRM_STATE['prospecta_avatar'] = optimizedBase64;
                }
                saveTempStateToDB();

                setTimeout(() => {
                    if (intendedFullscreen && !document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => console.log("Re-fullscreen bloqueado", err));
                    }
                }, 500); 
            });
        }

        function cargarEvidencia(event, imgId) {
            const file = event.target.files[0];
            if (!file) return;

            comprimirImagen(file, function(optimizedBase64) {
                const img = document.getElementById(imgId);
                img.src = optimizedBase64;
                img.classList.remove('hidden');
                
                const placeholder = img.parentElement.querySelector('.evidence-placeholder');
                if(placeholder) placeholder.classList.add('hidden');
                
                // Reemplazo localStorage
                window.CRM_STATE['prospecta_' + imgId] = optimizedBase64;
                saveTempStateToDB();
            });
        }

        function abrirEvidencia(event, src) {
            if (!isEditMode && src && !src.endsWith('index.html')) {
                event.preventDefault();
                event.stopPropagation();
                const modal = document.getElementById('evidencia-modal');
                const img = document.getElementById('evidencia-modal-img');
                img.src = src;
                
                isZoomed = false;
                document.getElementById('zoom-icon').classList.remove('fa-search-minus');
                document.getElementById('zoom-icon').classList.add('fa-search-plus');
                img.classList.add('max-w-full', 'max-h-full', 'object-contain');
                img.classList.remove('w-[250%]', 'max-w-none', 'h-auto');
                const container = document.getElementById('evidencia-scroll-container');
                container.classList.add('items-center', 'justify-center');
                container.classList.remove('items-start', 'justify-start');
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function cerrarEvidencia() {
            const modal = document.getElementById('evidencia-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        let isZoomed = false;
        function zoomEvidencia() {
            const img = document.getElementById('evidencia-modal-img');
            const container = document.getElementById('evidencia-scroll-container');
            const icon = document.getElementById('zoom-icon');
            isZoomed = !isZoomed;
            if(isZoomed) {
                img.classList.remove('max-w-full', 'max-h-full', 'object-contain');
                img.classList.add('w-[250%]', 'max-w-none', 'h-auto');
                container.classList.remove('items-center', 'justify-center');
                container.classList.add('items-start', 'justify-start');
                icon.classList.remove('fa-search-plus');
                icon.classList.add('fa-search-minus');
            } else {
                img.classList.add('max-w-full', 'max-h-full', 'object-contain');
                img.classList.remove('w-[250%]', 'max-w-none', 'h-auto');
                container.classList.add('items-center', 'justify-center');
                container.classList.remove('items-start', 'justify-start');
                icon.classList.remove('fa-search-minus');
                icon.classList.add('fa-search-plus');
            }
        }

        let timerInterval;
        let timeInSeconds = 0;
        let isTimerRunning = false;

        function updateCronometroDisplay() {
            const h = Math.floor(timeInSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((timeInSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (timeInSeconds % 60).toString().padStart(2, '0');
            document.getElementById('cronometro-display').innerText = `${h}:${m}:${s}`;
        }

        function toggleCronometro() {
            const btn = document.getElementById('btn-cronometro');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                btn.innerHTML = '<i class="fas fa-play mr-2 text-white"></i> Iniciar';
                btn.classList.remove('bg-red-500');
                btn.classList.add('bg-brand-primary');
            } else {
                timeInSeconds = 0; 
                updateCronometroDisplay();
                timerInterval = setInterval(() => {
                    timeInSeconds++;
                    updateCronometroDisplay();
                }, 1000);
                btn.innerHTML = '<i class="fas fa-stop mr-2 text-white"></i> Detener';
                btn.classList.remove('bg-brand-primary');
                btn.classList.add('bg-slate-600');
            }
            isTimerRunning = !isTimerRunning;
        }

        function cargarMediaZ7(event, baseId) {
            const file = event.target.files[0];
            if (!file) return;

            const isVideo = file.type.startsWith('video/');
            const imgEl = document.getElementById(baseId + '-img');
            const vidEl = document.getElementById(baseId + '-vid');
            const playEl = document.getElementById(baseId + '-play');
            const placeholder = document.getElementById(baseId + '-placeholder');
            
            if(placeholder) placeholder.classList.add('hidden');

            if (isVideo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgEl.classList.add('hidden');
                    vidEl.src = e.target.result;
                    vidEl.classList.remove('hidden');
                    if(playEl) playEl.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                comprimirImagen(file, function(optimizedBase64) {
                    vidEl.classList.add('hidden');
                    if(playEl) playEl.classList.add('hidden');
                    imgEl.src = optimizedBase64;
                    imgEl.classList.remove('hidden');
                });
            }
        }

        function toggleZ7Video(vidId, playId) {
            if (isEditMode) return; 
            const video = document.getElementById(vidId);
            const playBtn = document.getElementById(playId);
            if(video.paused) {
                video.play();
                if(playBtn) playBtn.classList.add('hidden');
            } else {
                video.pause();
                if(playBtn) playBtn.classList.remove('hidden');
            }
        }

                const el = document.getElementById(id);
                if(el) window.CRM_STATE['prospecta_' + id] = el.innerHTML;
            });
            CRM_STAR_IDS.forEach(id => {
                const el = document.getElementById(id);
                if(el) window.CRM_STATE['prospecta_' + id] = el.dataset.rating || '0';
            });
            CRM_ICON_IDS.forEach(id => {
                const el = document.getElementById(id);
                if(el) window.CRM_STATE['prospecta_' + id] = el.dataset.icon || '';
            });
            saveTempStateToDB();

        function loadCurrentState() {
            CRM_TEXT_IDS.forEach(id => {
                const val = window.CRM_STATE['prospecta_' + id];
                if(val !== undefined && document.getElementById(id)) document.getElementById(id).innerHTML = val;
            });
            CRM_STAR_IDS.forEach(id => {
                const val = window.CRM_STATE['prospecta_' + id];
                if(val !== undefined) setRatingVisuals(id, parseInt(val));
            });
            CRM_ICON_IDS.forEach(btnId => {
                const val = window.CRM_STATE['prospecta_' + btnId];
                if(val && document.getElementById(btnId)) {
                    document.getElementById(btnId).dataset.icon = val;
                    const iconId = btnId.replace('-btn-', '-icon-');
                    const iconEl = document.getElementById(iconId);
                    if(iconEl) iconEl.className = val;
                }
            });
            CRM_IMG_IDS.forEach(id => {
                const val = window.CRM_STATE['prospecta_' + id];
                const img = document.getElementById(id);
                if(val && img) {
                    img.src = val;
                    img.classList.remove('hidden');
                    const placeholder = img.parentElement.querySelector('.evidence-placeholder');
                    if(placeholder) placeholder.classList.add('hidden');
                } else if (!val && img) {
                    img.src = '';
                    img.classList.add('hidden');
                    const placeholder = img.parentElement.querySelector('.evidence-placeholder');
                    if(placeholder) placeholder.classList.remove('hidden');
                }
            });
        }

                if(prodCont) productosHTML = prodCont.innerHTML;

                let productosHTML = '';

        async function loadProfile(id) {
            let profiles = await dbGetAll('profiles');
            const profile = profiles.find(p => p.id === id);
            if(!profile) return;

            activeProfileId = id; 
            window.CRM_STATE['prospecta_active_profile_id'] = id; 

            if(profile.data) {
                Object.keys(profile.data).forEach(key => {
                    window.CRM_STATE['prospecta_' + key] = profile.data[key];
                });
            }

            loadCurrentState();

            if(profile.portada) {
                window.CRM_STATE['prospecta_portada'] = profile.portada;
                document.querySelectorAll('.portada-sync').forEach(t => t.style.backgroundImage = `linear-gradient(to bottom, rgba(62,62,97,0.5), transparent), url('${profile.portada}')`);
                ajustarAlturaPortada(profile.portada);
            }
            if(profile.avatar) {
                window.CRM_STATE['prospecta_avatar'] = profile.avatar;
                document.querySelectorAll('.avatar-sync').forEach(i => i.src = profile.avatar);
            }
            
            saveTempStateToDB();

            if (profile.guiones) {
                currentScripts = profile.guiones;
            } else {
                currentScripts = { ...scripts }; 
            }
            
            const prodCont = document.getElementById('z7-products-container');
            if(prodCont && profile.productos) {
                prodCont.innerHTML = profile.productos;
            }

            const compCont = document.getElementById('comp-carousel-container');
            if(compCont && profile.comp_carousel) compCont.innerHTML = profile.comp_carousel;

            const ownCont = document.getElementById('own-carousel-container');
            if(ownCont && profile.own_carousel) ownCont.innerHTML = profile.own_carousel;

            const evidCont = document.getElementById('evid-carousel-container');
            if(evidCont && profile.evid_carousel) evidCont.innerHTML = profile.evid_carousel;

            if(profile.canvases) {
                for(let i=3; i<=7; i++) {
                    const c = document.getElementById('builder-canvas-' + i);
                    if(c && profile.canvases['zona_'+i]) {
                        c.innerHTML = profile.canvases['zona_'+i];
                    }
                }
            }
            
            updateUI(); 
            alert("Perfil cargado: " + profile.name);
        }

        // 4. NUEVAS FUNCIONES DE EXPORTACIÓN E IMPORTACIÓN (.emi)
        async function exportarPerfil(id, event) {
            if(event) event.stopPropagation();
            let profiles = await dbGetAll('profiles');
            const profile = profiles.find(p => p.id === id);
            if(!profile) return;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(profile));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            const fileName = (profile.name ? profile.name.replace(/\s+/g, '_') : 'Perfil_Cliente') + ".emi";
            downloadAnchorNode.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function setupImportEmi() {
            const input = document.createElement('input');
            input.type = 'file';
            input.id = 'importEmiInput';
            input.accept = '.emi,.json';
            input.style.display = 'none';
            input.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = async function(evt) {
                    try {
                        const loadedData = JSON.parse(evt.target.result);
                        if(loadedData.id && loadedData.name && loadedData.data) {
                            loadedData.id = Date.now().toString(); // Asigna nuevo ID para evitar colisiones
                            loadedData.name = loadedData.name + " (Importado)";
                            await dbPut('profiles', loadedData);
                            alert("Perfil importado con éxito: " + loadedData.name);
                            renderProfilesList();
                        } else {
                            alert("El archivo .emi no es válido o está dañado.");
                        }
                    } catch(err) {
                        alert("Error al leer el archivo .emi");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            });
            document.body.appendChild(input);
        }

        function loadBlockMedia(input, blockId, type) {
            const file = input.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file); 
            
            input.parentElement.classList.add('hidden');

            if(type === 'imagen') {
                const img = document.getElementById('img_'+blockId);
                img.src = url; img.classList.remove('hidden');
            } else if(type === 'video') {
                const vid = document.getElementById('vid_'+blockId);
                vid.src = url; vid.classList.remove('hidden');
                document.getElementById('ctrl_'+blockId).classList.remove('hidden');
                vid.play(); toggleVid(blockId, true); 
            } else if(type === 'audio') {
                const aud = document.getElementById('aud_'+blockId);
                aud.src = url;
                input.parentElement.classList.remove('hidden'); 
            }
        }

        function toggleVid(id, isForcePlay=false) {
            const v = document.getElementById('vid_'+id);
            if(!v.src) return;
            if (v.paused || isForcePlay) { v.play(); document.getElementById('i_play_'+id).classList.add('hidden'); document.getElementById('i_pause_'+id).classList.remove('hidden'); }
            else { v.pause(); document.getElementById('i_play_'+id).classList.remove('hidden'); document.getElementById('i_pause_'+id).classList.add('hidden'); }
        }
        function muteVid(id) {
            const v = document.getElementById('vid_'+id);
            v.muted = !v.muted;
            if(v.muted) { document.getElementById('i_vol_'+id).classList.add('hidden'); document.getElementById('i_mute_'+id).classList.remove('hidden'); }

        let currentScripts = { ...scripts }; 
        let currentSlide = 1;
        const totalSlides = 7;
        let notesVisible = false;

        function goToSlide(index) {
            if (index >= 1 && index <= totalSlides) {
                currentSlide = index;
                updateUI();
            }
        }

        function updateUI() {
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
                if (parseInt(slide.dataset.slide) === currentSlide) {
                    slide.classList.add('active');
                }
            });

            document.getElementById('progress-bar').style.width = `${(currentSlide / totalSlides) * 100}%`;
            document.getElementById('script-content').innerHTML = currentScripts[currentSlide] || "<p>Sin notas para esta diapositiva.</p>";
            
            const notesPanel = document.getElementById('script-content');
            if(notesPanel) notesPanel.scrollTop = 0;
            
            const presentationArea = document.getElementById('presentation-area');
            if(presentationArea) presentationArea.scrollTo({ top: 0, behavior: 'smooth' });

            for(let i = 1; i <= totalSlides; i++) {
                const pill = document.getElementById('nav-pill-' + i);
                if(pill) {
                    if(i === currentSlide) {
                        pill.className = "shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-colors bg-white text-brand-dark border-2 border-white shadow-md outline-none flex items-center justify-center";
                        pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        pill.className = "shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-colors bg-brand-dark text-white border border-[#3E3E61] hover:bg-[#3E3E61] outline-none flex items-center justify-center";
                    }
                }
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateUI();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                updateUI();
            }
        }

        function toggleNotes() {
            const sidebar = document.getElementById('notes-sidebar');
            notesVisible = !notesVisible;
            
            if (notesVisible) {
                sidebar.classList.remove('w-0');
                sidebar.classList.add('w-full', 'md:w-[400px]');
            } else {
                sidebar.classList.add('w-0');
                sidebar.classList.remove('w-full', 'md:w-[400px]');
            }
        }

        function toggleAccordion(btn) {
            const container = btn.closest('.bg-brand-panel') || btn.closest('.dynamic-block') || btn.closest('.accordion-wrapper');
            const content = container.querySelector('.acc-content'); 
            const icon = btn.querySelector('.fa-chevron-down');
            
            if(content) {
                if(content.classList.contains('hidden')) {
                    content.classList.remove('hidden');
                    content.classList.add('block');
                } else {
                    content.classList.add('hidden');
                    content.classList.remove('block');
                }
            }
            if(icon) icon.classList.toggle('rotate-180');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        function setRating(containerId, rating) {
            if (!isEditMode) return; 
            setRatingVisuals(containerId, rating);
            saveCurrentState();
        }

        function setRatingVisuals(containerId, rating) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.dataset.rating = rating;
            const stars = container.querySelectorAll('.star-btn');
            
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('far');
                    star.classList.add('fas');    
                } else {
                    star.classList.remove('fas'); 
                    star.classList.add('far');    
                }
            });
        }

        function toggleIconMenu(menuId) {
            if (!isEditMode) return; 
            document.querySelectorAll('.icon-dropdown.show').forEach(menu => {
                if(menu.id !== menuId) menu.classList.remove('show');
            });
            const menu = document.getElementById(menuId);
            menu.classList.toggle('show');
        }

        function changeIcon(btnId, iconId, menuId, newIconClass) {
            document.getElementById(iconId).className = newIconClass;
            document.getElementById(btnId).dataset.icon = newIconClass;
            document.getElementById(menuId).classList.remove('show');
            saveCurrentState(); 
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.icon-selector') && !event.target.closest('.icon-dropdown')) {
                document.querySelectorAll('.icon-dropdown.show').forEach(menu => {
                    menu.classList.remove('show');
                });
            }
        });

        // 5. INICIALIZADOR PRINCIPAL MODIFICADO
        window.addEventListener('DOMContentLoaded', async () => {
            await initIndexedDB(); 
            await loadTempStateFromDB(); // Cargamos el caché en memoria antes de hacer nada
            
            setupImportEmi(); // Inyectamos la lógica de importación al DOM invisiblemente

            // Restauramos el ID del perfil activo desde la memoria
            activeProfileId = window.CRM_STATE['prospecta_active_profile_id'] || null;
            
            initBackgroundStars(); 
            loadCurrentState(); 
            
            const savedSize = window.CRM_STATE['prospecta_script_fontsize'];
            if (savedSize) {
                scriptFontSize = parseInt(savedSize);
                document.getElementById('script-content').style.fontSize = scriptFontSize + 'px';
            }

            document.getElementById('script-content').addEventListener('input', function() {
                if(isEditMode) {
                    currentScripts[currentSlide] = this.innerHTML;
                }
            });
            
            const savedPortada = window.CRM_STATE['prospecta_portada'];
            const savedAvatar = window.CRM_STATE['prospecta_avatar'];

            if (savedPortada) {
                const covers = document.querySelectorAll('.portada-sync');
                covers.forEach(target => {
                    target.style.backgroundImage = `linear-gradient(to bottom, rgba(62,62,97,0.5), transparent), url('${savedPortada}')`;
                });
                ajustarAlturaPortada(savedPortada);
            } else {
                ajustarAlturaPortada('https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&q=80&w=1000');
            }

            if (savedAvatar) {
                const avatars = document.querySelectorAll('.avatar-sync');
                avatars.forEach(img => {
                    img.src = savedAvatar;
                });
            }
            
            updateUI();
            renderProfilesList();
        });

        function setDateTime() {
            const now = new Date();
            const fechaEls = document.querySelectorAll('#display_fecha');
            const horaEls = document.querySelectorAll('#display_hora');
            fechaEls.forEach(el => el.innerText = now.toLocaleDateString('es-MX', {day:'2-digit', month:'short'}));
            horaEls.forEach(el => el.innerText = now.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}));
        }
        setInterval(setDateTime, 60000); 
        setDateTime(); 
    </script>
